<!doctype html>
<html lang="en" class="scroll-pt-24">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#0e7490" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfcfd" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12161c" />
		<script>
			// Applied before first paint so a stored preference never flashes the
			// wrong theme. Absent a stored choice, nothing is set and the CSS
			// falls back to prefers-color-scheme.
			try {
				const stored = localStorage.getItem('theme');
				if (stored === 'light' || stored === 'dark') {
					document.documentElement.dataset.theme = stored;
				}
			} catch {
				/* storage unavailable; system preference applies */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
