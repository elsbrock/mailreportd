version: 2

project_name: mailreportd

builds:
  - main: .
    binary: mailreportd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Builds the image from the prebuilt linux binaries; see Dockerfile.goreleaser.
dockers_v2:
  - images:
      - ghcr.io/elsbrock/mailreportd
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
