# mailreportd configuration.
#
# Credentials are never stored here. Every secret is named by the environment
# variable that carries it, so this file stays committable.

log:
  level: info
  format: text

http:
  # Reachable from outside; carries /healthz, and POST /tlsrpt when enabled.
  listen: ":8088"
  # Keep this on a private interface.
  metrics_listen: ":9188"
  # Accept RFC 8460 TLS report submissions over HTTPS on the public listener.
  # Enable only if your TLS-RPT record publishes an https rua.
  # tlsrpt_submission: true

storage:
  path: /var/lib/mailreportd/reports.db
  retention:
    # Source bytes, kept only long enough to debug a parse failure.
    raw: 168h
    # Aggregate report rows.
    aggregate: 8760h
    # Failure reports contain recipient addresses and message content, so
    # their window is deliberately short.
    forensic: 168h
  # Hex-encoded 32-byte key (openssl rand -hex 32). Failure report content
  # is encrypted with it at rest; without a key, only envelopes are stored
  # and the content is dropped rather than written in the clear.
  # failure_key_file: /run/credentials/mailreportd/failure.key

policy:
  # How long a published-policy check result is reused.
  cache_ttl: 15m
  # DKIM selectors to check, per domain. This is the one thing the daemon cannot
  # derive: DNS offers no way to enumerate the names published under
  # _domainkey, so an unlisted selector is invisible. Domains omitted here are
  # still checked for DMARC and MTA-STS.
  selectors:
    example.org:
      - default

tenants:
  - id: default
    domains:
      - example.org

feeders:
  - type: imap
    tenant: default
    host: mail.example.org
    port: 993
    username: dmarc@example.org
    # One of password_env or password_file. A file is preferred where the
    # supervisor provides one, e.g. systemd LoadCredential.
    password_env: MAILREPORTD_IMAP_PASSWORD
    # password_file: /run/credentials/mailreportd.service/imap-password
    # Folders to read, in order. `mailbox: INBOX` still works for one.
    mailboxes: [INBOX]
    # Also read the folder the server marks \Junk (RFC 6154), whatever it is
    # called. Spam filters file reports there. Read-only, like every folder.
    include_junk: true
    interval: 5m
  # A locally delivered maildir works in place of IMAP. The feeder reads
  # new/ and cur/ and never renames, moves or deletes a file.
  # - type: maildir
  #   tenant: default
  #   path: /var/mail/dmarc
  #   interval: 5m
